<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>ASIPad</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <section id="home" class="view">
      <header><h1>ASIPad</h1></header>
      <div class="grid">
        <button class="tile tile-calendar" data-route="kalender">
          <div class="tile-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <rect x="3" y="5" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/>
              <path d="M3 10h18" stroke="currentColor" stroke-width="1.5"/>
              <path d="M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              <text x="12" y="17" text-anchor="middle" font-size="7" font-weight="700" fill="currentColor" id="cal-day-num">--</text>
            </svg>
          </div>
          <div class="tile-title">Kalender</div>
          <div class="tile-sub" id="cal-date">…</div>
        </button>
        <button class="tile" data-route="tegne">
          <div class="tile-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2l8 8-12 12H2v-8z"/>
              <path d="M12 4l8 8"/>
            </svg>
          </div>
          <div class="tile-title">Tegne</div>
        </button>
        <button class="tile" data-route="bilder">
          <div class="tile-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="3" y="5" width="18" height="14" rx="2"/>
              <circle cx="9" cy="11" r="2"/>
              <path d="M3 17l5-5 4 4 3-3 6 6"/>
            </svg>
          </div>
          <div class="tile-title">Bilder</div>
        </button>
        <button class="tile" data-route="musikk">
          <div class="tile-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 18V5l12-2v13"/>
              <circle cx="6" cy="18" r="3"/>
              <circle cx="18" cy="16" r="3"/>
            </svg>
          </div>
          <div class="tile-title">Musikk</div>
        </button>
        <button class="tile" data-route="lese">
          <div class="tile-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 5a2 2 0 0 1 2-2h6v18H5a2 2 0 0 1-2-2z"/>
              <path d="M21 5a2 2 0 0 0-2-2h-6v18h6a2 2 0 0 0 2-2z"/>
            </svg>
          </div>
          <div class="tile-title">Lese</div>
        </button>
        <button class="tile" data-route="spill">
          <div class="tile-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 12h4M8 10v4"/>
              <circle cx="16" cy="11" r="1.2" fill="currentColor"/>
              <circle cx="18" cy="13" r="1.2" fill="currentColor"/>
              <rect x="2" y="7" width="20" height="11" rx="5"/>
            </svg>
          </div>
          <div class="tile-title">Spill</div>
        </button>
      </div>
    </section>

    <section id="page" class="view hidden">
      <header>
        <button id="back" type="button" aria-label="Tilbake">← Tilbake</button>
        <h1 id="page-title"></h1>
      </header>
      <div class="page-body" id="page-body"></div>
    </section>
  </main>

  <button id="power-trigger" type="button" aria-label="Av/på"></button>

  <dialog id="power-menu">
    <h2>Hva vil du gjøre?</h2>
    <div class="actions">
      <button type="button" data-action="shutdown">Slå av</button>
      <button type="button" data-action="reboot">Start på nytt</button>
      <button type="button" data-action="cancel" autofocus>Avbryt</button>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
