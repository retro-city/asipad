<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>ASIPad</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <section id="home" class="view">
      <header><h1>ASIPad</h1></header>
      <div class="grid">
        <button class="tile tile-calendar" data-route="kalender">
          <div class="tile-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <rect x="3" y="5" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/>
              <path d="M3 10h18" stroke="currentColor" stroke-width="1.5"/>
              <path d="M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              <text x="12" y="17" text-anchor="middle" font-size="7" font-weight="700" fill="currentColor" id="cal-day-num">--</text>
            </svg>
          </div>
          <div class="tile-title">Kalender</div>
          <div class="tile-sub" id="cal-date">…</div>
        </button>
        <button class="tile" data-route="lese">
          <div class="tile-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 5a2 2 0 0 1 2-2h6v18H5a2 2 0 0 1-2-2z"/>
              <path d="M21 5a2 2 0 0 0-2-2h-6v18h6a2 2 0 0 0 2-2z"/>
            </svg>
          </div>
          <div class="tile-title">Lese</div>
        </button>
        <button class="tile icon-only" data-route="bilder" aria-label="Kommer snart">
          <div class="tile-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 4h6l3 16H6z"/>
              <line x1="7.7" y1="11" x2="16.3" y2="11"/>
              <line x1="6.7" y1="16" x2="17.3" y2="16"/>
              <line x1="3" y1="20" x2="21" y2="20"/>
            </svg>
          </div>
        </button>
        <button class="tile icon-only" data-route="musikk" aria-label="Kommer snart">
          <div class="tile-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 4h6l3 16H6z"/>
              <line x1="7.7" y1="11" x2="16.3" y2="11"/>
              <line x1="6.7" y1="16" x2="17.3" y2="16"/>
              <line x1="3" y1="20" x2="21" y2="20"/>
            </svg>
          </div>
        </button>
        <button class="tile icon-only" data-route="tegne" aria-label="Kommer snart">
          <div class="tile-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 4h6l3 16H6z"/>
              <line x1="7.7" y1="11" x2="16.3" y2="11"/>
              <line x1="6.7" y1="16" x2="17.3" y2="16"/>
              <line x1="3" y1="20" x2="21" y2="20"/>
            </svg>
          </div>
        </button>
        <button class="tile" data-route="innstillinger">
          <div class="tile-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"/>
              <path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>
            </svg>
          </div>
          <div class="tile-title">Innstillinger</div>
        </button>
      </div>
    </section>

    <section id="page" class="view hidden">
      <header>
        <button id="back" type="button" aria-label="Tilbake">← Tilbake</button>
        <h1 id="page-title"></h1>
      </header>
      <div class="page-body" id="page-body"></div>
    </section>
  </main>

  <button id="power-trigger" type="button" aria-label="Av/på"></button>

  <dialog id="power-menu">
    <h2>Hva vil du gjøre?</h2>
    <div class="actions">
      <button type="button" data-action="shutdown">Slå av</button>
      <button type="button" data-action="reboot">Start på nytt</button>
      <button type="button" data-action="cancel" autofocus>Avbryt</button>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
