<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>ASIPad</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <section id="home" class="view">
      <header>
        <img class="header-logo" src="/assets/asipad-white.svg" alt="">
        <h1></h1>
      </header>
      <div class="grid">
        <button class="tile" data-route="skole">
          <div class="tile-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 9l10-5 10 5-10 5z"/>
              <path d="M6 11v5c0 1 4 2 6 2s6-1 6-2v-5"/>
              <line x1="22" y1="9" x2="22" y2="14"/>
            </svg>
          </div>
          <div class="tile-title" data-i18n="page.school">Skole</div>
        </button>
        <button class="tile" data-route="jobb">
          <div class="tile-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="5" width="18" height="11" rx="1.5"/>
              <line x1="2" y1="19" x2="22" y2="19"/>
              <line x1="9" y1="19" x2="15" y2="19"/>
            </svg>
          </div>
          <div class="tile-title" data-i18n="page.work">Jobb</div>
        </button>
        <button class="tile" data-route="fritid">
          <div class="tile-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 11 L12 4 L21 11 V20 H3 z"/>
              <path d="M10 20 V13 H14 V20"/>
            </svg>
          </div>
          <div class="tile-title" data-i18n="page.fritid">Fritid</div>
        </button>
        <button class="tile tile-calendar" data-route="kalender">
          <div class="tile-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <rect x="3" y="5" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/>
              <path d="M3 10h18" stroke="currentColor" stroke-width="1.5"/>
              <path d="M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              <text x="12" y="17" text-anchor="middle" font-size="7" font-weight="700" fill="currentColor" id="cal-day-num">--</text>
            </svg>
          </div>
          <div class="tile-title" data-i18n="page.calendar">Kalender</div>
          <div class="tile-sub" id="cal-date">…</div>
        </button>
        <button class="tile" data-route="bank">
          <div class="tile-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <ellipse cx="12" cy="6" rx="8" ry="2.5"/>
              <path d="M4 6 v4 c0 1.4 3.6 2.5 8 2.5 s8 -1.1 8 -2.5 v-4"/>
              <path d="M4 12 v4 c0 1.4 3.6 2.5 8 2.5 s8 -1.1 8 -2.5 v-4"/>
              <path d="M4 18 v0.5 c0 1.4 3.6 2.5 8 2.5 s8 -1.1 8 -2.5 v-0.5"/>
            </svg>
          </div>
          <div class="tile-title" data-i18n="page.bank">Bank</div>
        </button>
        <button class="tile" data-route="innstillinger">
          <div class="tile-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65a.5.5 0 00.12-.64l-2-3.46a.5.5 0 00-.61-.22l-2.49 1a7.03 7.03 0 00-1.69-.98l-.38-2.65A.49.49 0 0014 2h-4a.49.49 0 00-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1a.5.5 0 00-.61.22l-2 3.46a.5.5 0 00.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65a.5.5 0 00-.12.64l2 3.46a.5.5 0 00.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65A.49.49 0 0010 22h4a.49.49 0 00.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1a.5.5 0 00.61-.22l2-3.46a.5.5 0 00-.12-.64l-2.11-1.65zM12 15.5A3.5 3.5 0 1115.5 12 3.5 3.5 0 0112 15.5z"/>
            </svg>
          </div>
          <div class="tile-title" data-i18n="page.settings">Innstillinger</div>
        </button>
      </div>
    </section>

    <section id="page" class="view hidden">
      <header>
        <button id="back" type="button" aria-label="Tilbake"><span data-i18n="common.back">← Tilbake</span></button>
        <h1 id="page-title"></h1>
      </header>
      <div class="page-body" id="page-body"></div>
    </section>
  </main>

  <button id="lock-trigger" type="button" aria-label="Lås" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="5" y="11" width="14" height="9" rx="1.6"/>
      <path d="M8 11V8a4 4 0 0 1 8 0v3"/>
    </svg>
  </button>
  <button id="power-trigger" type="button" aria-label="Av/på"></button>

  <dialog id="power-menu">
    <h2 data-i18n="power.prompt">Hva vil du gjøre?</h2>
    <div class="actions">
      <button type="button" data-action="shutdown" data-i18n="power.shutdown">Slå av</button>
      <button type="button" data-action="reboot" data-i18n="power.reboot">Start på nytt</button>
      <button type="button" data-action="cancel" autofocus data-i18n="common.cancel">Avbryt</button>
    </div>
  </dialog>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
